<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="50%" stop-color="#141e28"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088cc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-opacity="0.7"/>

  <!-- Tactical Hex / Grid overlay -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#253545" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyan-grad)" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Crosshair Reticle Lines -->
  <line x1="256" y1="36" x2="256" y2="100" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="476" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="100" y2="256" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="476" y2="256" stroke="url(#gold-grad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Dot -->
  <circle cx="256" cy="256" r="7" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Counter-Strike Soldier Tactical Silhouette -->
  <g fill="url(#gold-grad)" filter="url(#glow)">
    <!-- Helmet & Visor -->
    <path d="M 230 145 C 230 120, 282 120, 282 145 C 290 155, 290 175, 285 185 L 227 185 C 222 175, 222 155, 230 145 Z"/>
    <!-- Tactical Visor Glow -->
    <rect x="238" y="156" width="36" height="10" rx="3" fill="#050c14"/>
    <rect x="240" y="158" width="32" height="6" rx="2" fill="#00f0ff"/>
    <!-- Headset -->
    <rect x="220" y="150" width="8" height="22" rx="3" fill="#ffb300"/>
    <path d="M 224 165 Q 235 180 248 180" fill="none" stroke="#ffb300" stroke-width="3" stroke-linecap="round"/>

    <!-- Tactical Torso & Vest -->
    <path d="M 210 196 L 302 196 L 320 265 L 306 315 L 206 315 L 192 265 Z"/>
    <!-- Collar & Neck -->
    <rect x="242" y="185" width="28" height="14" fill="#ffb300"/>
    <!-- Tactical Plate Lines -->
    <line x1="230" y1="230" x2="282" y2="230" stroke="#0a1017" stroke-width="4"/>
    <line x1="234" y1="260" x2="278" y2="260" stroke="#0a1017" stroke-width="4"/>
    <line x1="256" y1="205" x2="256" y2="305" stroke="#0a1017" stroke-width="4"/>

    <!-- Arms & Rifle in Ready Stance -->
    <!-- Left Arm -->
    <path d="M 194 210 L 155 250 L 175 275 L 210 240 Z"/>
    <!-- Right Arm holding M4 / AK -->
    <path d="M 318 210 L 360 255 L 340 280 L 305 240 Z"/>

    <!-- Gun Silhouette across Chest -->
    <path d="M 145 235 L 370 235 L 370 248 L 300 248 L 295 275 L 280 275 L 285 248 L 145 248 Z" fill="#ffffff"/>
    <rect x="370" y="238" width="45" height="6" fill="#ffffff"/>
    <rect x="235" y="248" width="16" height="35" rx="3" fill="#ffffff" transform="rotate(-15 240 250)"/>
  </g>

  <!-- Typography "CS" and "1.6" -->
  <text x="256" y="380" font-family="'Teko', 'Impact', sans-serif" font-size="78" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    COUNTER-STRIKE
  </text>
  
  <g transform="translate(256, 430)">
    <rect x="-65" y="-28" width="130" height="42" rx="8" fill="#ff9900"/>
    <text x="0" y="4" font-family="'Teko', 'Impact', sans-serif" font-size="36" font-weight="900" fill="#05080c" text-anchor="middle" letter-spacing="3">
      ★ 1.6 ★
    </text>
  </g>
</svg>
